# Base44 dev environment for codexRC
# Flask backend serving static HTML frontend — no database required.
services:
  web:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "3000:8000"
    environment:
      # Bind 0.0.0.0 so the preview proxy can reach the dev server
      - CODEXRC_LAN=1
      - BASE44_PREVIEW_MODE
    command:
      - sh
      - -ec
      - >
        pip install --no-cache-dir -r requirements.txt &&
        exec python -m flask --app backend.app run
        --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: on-failure
