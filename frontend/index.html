<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>codexRC – Visual Pipeline</title>
  <style>
    :root {
      --bg: #0f1117;
      --panel: #1a1d27;
      --border: #2a2f3a;
      --text: #e6e9f0;
      --muted: #8b93a7;
      --accent: #6c5ce7;
      --success: #00b894;
      --running: #fdcb6e;
      --failed: #e17055;
      --pending: #636e72;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--panel);
    }
    header h1 { font-size: 1.25rem; font-weight: 600; }
    header h1 span { color: var(--accent); }
    .badge { font-size: 0.7rem; background: var(--accent); color: white; padding: 0.15rem 0.5rem; border-radius: 999px; margin-left: 0.5rem; }
    main { flex: 1; display: grid; grid-template-columns: 320px 1fr; gap: 0; }
    .sidebar {
      background: var(--panel);
      border-right: 1px solid var(--border);
      padding: 1.25rem;
      overflow-y: auto;
    }
    .sidebar h2 { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 1rem; }
    label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 0.3rem; }
    input, select, button, textarea {
      width: 100%;
      padding: 0.55rem 0.75rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.9rem;
      margin-bottom: 0.9rem;
    }
    button {
      background: var(--accent);
      border: none;
      cursor: pointer;
      font-weight: 600;
      transition: opacity 0.15s;
    }
    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .canvas-area {
      padding: 1.5rem;
      overflow: auto;
      position: relative;
    }
    .pipeline {
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
      align-items: flex-start;
      justify-content: center;
      min-height: 280px;
      margin-bottom: 2rem;
    }
    .node {
      background: var(--panel);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 1rem 1.25rem;
      min-width: 140px;
      text-align: center;
      position: relative;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .node.running { border-color: var(--running); box-shadow: 0 0 12px rgba(253,203,110,0.25); }
    .node.success { border-color: var(--success); }
    .node.failed { border-color: var(--failed); }
    .node.pending { border-color: var(--pending); opacity: 0.7; }
    .node .label { font-weight: 600; font-size: 0.95rem; }
    .node .status { font-size: 0.75rem; color: var(--muted); margin-top: 0.35rem; text-transform: uppercase; }
    .node .duration { font-size: 0.7rem; color: var(--muted); margin-top: 0.2rem; }
    .arrow {
      display: flex;
      align-items: center;
      color: var(--muted);
      font-size: 1.4rem;
    }
    .results {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      max-height: 420px;
      overflow-y: auto;
    }
    .results h3 { font-size: 0.95rem; margin-bottom: 0.75rem; color: var(--muted); }
    pre {
      background: var(--bg);
      padding: 1rem;
      border-radius: 8px;
      font-size: 0.78rem;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .auth-section { margin-top: 1.2rem; padding-top: 1rem; border-top: 1px solid var(--border); }
    .hint { font-size: 0.75rem; color: var(--muted); margin-top: -0.5rem; margin-bottom: 0.8rem; }
  </style>
</head>
<body>
  <header>
    <h1><span>codex</span>RC <span class="badge">local</span></h1>
    <div style="font-size:0.85rem;color:var(--muted)">Visual Pipeline · n8n-style</div>
  </header>

  <main>
    <aside class="sidebar">
      <h2>Nuevo escaneo</h2>
      <label>URL objetivo</label>
      <input type="url" id="targetUrl" placeholder="https://example.com" value="https://example.com" />

      <div class="auth-section">
        <h2>Autenticación (opcional)</h2>
        <label>Método</label>
        <select id="authMethod">
          <option value="none">Ninguno (público)</option>
          <option value="cookies">Cookies</option>
          <option value="credentials">Usuario + Contraseña</option>
          <option value="bearer">Bearer Token</option>
        </select>

        <div id="authCookies" style="display:none">
          <label>Cookies (name=value; ...)</label>
          <textarea id="cookiesRaw" rows="3" placeholder="sessionid=abc; token=xyz"></textarea>
        </div>

        <div id="authCreds" style="display:none">
          <label>Login URL</label>
          <input type="url" id="loginUrl" placeholder="https://example.com/login" />
          <label>Usuario</label>
          <input type="text" id="username" />
          <label>Contraseña</label>
          <input type="password" id="password" />
        </div>

        <div id="authBearer" style="display:none">
          <label>Bearer Token</label>
          <input type="text" id="bearerToken" placeholder="eyJhbGciOi..." />
        </div>
      </div>

      <button id="btnScan" onclick="startScan()">Iniciar Pipeline</button>
      <p class="hint">El backend debe estar corriendo en :8000</p>
    </aside>

    <section class="canvas-area">
      <div class="pipeline" id="pipeline">
        <!-- nodes injected by JS -->
      </div>

      <div class="results">
        <h3>Resultados del pipeline</h3>
        <pre id="output">Esperando escaneo...</pre>
      </div>
    </section>
  </main>

  <script>
    const NODES = [
      { id: "recon", label: "Recon" },
      { id: "tech_detect", label: "Tech Detect" },
      { id: "cve_match", label: "CVE Matcher" },
      { id: "auth_status", label: "Auth Status" },
    ];

    function renderPipeline(statusMap = {}) {
      const container = document.getElementById("pipeline");
      container.innerHTML = "";
      NODES.forEach((n, i) => {
        const st = statusMap[n.id] || { status: "pending" };
        const div = document.createElement("div");
        div.className = `node ${st.status || "pending"}`;
        div.innerHTML = `
          <div class="label">${n.label}</div>
          <div class="status">${st.status || "pending"}</div>
          ${st.duration != null ? `<div class="duration">${st.duration}s</div>` : ""}
        `;
        container.appendChild(div);
        if (i < NODES.length - 1) {
          const arrow = document.createElement("div");
          arrow.className = "arrow";
          arrow.textContent = "→";
          container.appendChild(arrow);
        }
      });
    }

    renderPipeline();

    document.getElementById("authMethod").addEventListener("change", (e) => {
      const v = e.target.value;
      document.getElementById("authCookies").style.display = v === "cookies" ? "block" : "none";
      document.getElementById("authCreds").style.display = v === "credentials" ? "block" : "none";
      document.getElementById("authBearer").style.display = v === "bearer" ? "block" : "none";
    });

    async function startScan() {
      const url = document.getElementById("targetUrl").value.trim();
      if (!url) return alert("Pon una URL");

      const method = document.getElementById("authMethod").value;
      const body = { url };

      if (method === "cookies") {
        const raw = document.getElementById("cookiesRaw").value.trim();
        if (raw) {
          const cookies = {};
          raw.split(";").forEach(p => {
            const [k, ...rest] = p.split("=");
            if (k && rest.length) cookies[k.trim()] = rest.join("=").trim();
          });
          body.cookies = cookies;
        }
      } else if (method === "credentials") {
        body.login_url = document.getElementById("loginUrl").value.trim();
        body.username = document.getElementById("username").value;
        body.password = document.getElementById("password").value;
      } else if (method === "bearer") {
        body.bearer_token = document.getElementById("bearerToken").value.trim();
      }

      const btn = document.getElementById("btnScan");
      btn.disabled = true;
      btn.textContent = "Ejecutando...";
      document.getElementById("output").textContent = "Pipeline en ejecución...";

      // Mark all as running visually
      const runningMap = {};
      NODES.forEach(n => runningMap[n.id] = { status: "running" });
      renderPipeline(runningMap);

      try {
        const res = await fetch("/api/scan", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "Error");

        // Update node statuses
        const statusMap = {};
        if (data.results) {
          for (const [k, v] of Object.entries(data.results)) {
            statusMap[k] = { status: v.status, duration: v.duration };
          }
        }
        renderPipeline(statusMap);
        document.getElementById("output").textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        document.getElementById("output").textContent = "Error: " + err.message;
        renderPipeline();
      } finally {
        btn.disabled = false;
        btn.textContent = "Iniciar Pipeline";
      }
    }
  </script>
</body>
</html>
